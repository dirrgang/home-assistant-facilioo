name: PR title

# Pull requests are squash-merged with the PR title as the commit message, so the title
# is what release-please reads to choose the next version and write CHANGELOG.md. The
# commit messages inside a branch are discarded on merge and are not checked here.
# Configuration follows the action's README; the default types are the Conventional
# Commit types release-please recognizes. `synchronize` re-runs the check for every new
# head commit, so it can be made a required check.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
