name: PR title

# Pull requests are squash-merged with the PR title as the commit subject, so the title
# is what release-please reads to choose the next version and write CHANGELOG.md. The
# commit messages inside a branch are discarded on merge and are not checked here.
# `synchronize` re-runs the check for every new head commit, so it can be required.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        # The types are the ones release-please recognizes; see CONTRIBUTING.md.
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([A-Za-z0-9._/-]+\))?!?: [^[:space:]]'
          printf 'Title: %s\n' "$TITLE"
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::The pull request title must be a Conventional Commit, e.g. 'fix: handle empty readings' or 'feat(sensor)!: rename entities'. See CONTRIBUTING.md."
            exit 1
          fi
