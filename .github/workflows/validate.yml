name: Home Assistant validation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The published Hassfest image still rejects the new manifest "categories"
      # field. Build the official category-aware validator from a pinned Core
      # revision and provide it under the image name used by the Hassfest action.
      # Keep the action itself as the validator; do not disable any checks.
      - name: Check out category-aware Hassfest source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/core
          ref: e2389ab001bb2b6bf720c23155091ee98de1e62f
          path: .hassfest-core
          persist-credentials: false
      - name: Build Hassfest image for official action
        run: >-
          docker build --file .hassfest-core/script/hassfest/docker/Dockerfile
          --tag ghcr.io/home-assistant/hassfest:latest .hassfest-core
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
