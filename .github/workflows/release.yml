name: Release

# release-please keeps a release PR open that bumps pyproject.toml, manifest.json and
# uv.lock and updates CHANGELOG.md from Conventional Commits. Merging it creates the
# vX.Y.Z tag and GitHub release that HACS consumes. Nothing is built or uploaded.
#
# release-please authenticates as a GitHub App, not with GITHUB_TOKEN: pull requests
# created with GITHUB_TOKEN do not trigger workflows, so CI would not run on the release
# PR. Requires the repository variable APP_CLIENT_ID and secret APP_PRIVATE_KEY of an App
# installed on this repository with Contents and Pull requests read and write access.
# Without them the run fails before release-please starts and nothing is released.
on:
  push:
    branches: [master]

# GITHUB_TOKEN is not used; the App token carries the permissions listed below.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write # create tag and GitHub release, push the release branch
          permission-pull-requests: write # open, update and label the release PR

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
