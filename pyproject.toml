[project]
name = "home-assistant-facilioo"
version = "0.3.0"
description = "Unofficial Home Assistant integration for Facilioo consumption data"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [
  { name = "Dennis", email = "d@irrgang.dev" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = [
  "homeassistant>=2026.4.0",
  "jsonschema>=4.26.0",
  "rfc3339-validator>=0.1.4",
  "pytest>=8.3.0",
  "pytest-aiohttp>=1.1.0",
  "pytest-cov>=6.0.0",
  "pytest-homeassistant-custom-component>=0.13.300",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
